# Genai_incidents Workflow Data Release Workflow

## Action

Follow the data-release-workflow workflow:
1. Update incident data files (data/incidents.json, data/incidents.min.json, src/genai_incidents/data/incidents.min.json)
2. Update or generate deprecation/id mapping files (data/id_deprecations.json, src/genai_incidents/data/id_deprecations.json)
3. Update documentation files (INCIDENTS.md, CHANGELOG.md, CITATION.cff)
4. Update or add incident markdown files (docs/incident/INC-*.md)
5. Update summary/yearly documentation (docs/incidents/YYYY.md)
6. Update charts and visualizations (docs/charts/*.svg)
7. Update minified data for docs (docs/data/incidents.min.json)
8. Update project metadata (pyproject.toml)
9. Update or run scripts as needed (scripts/merge_and_dedupe.py)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: data/incidents.json, data/incidents.min.json, data/id_deprecations.json

