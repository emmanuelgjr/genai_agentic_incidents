# Genai_incidents Workflow Full Data Rebuild And Site Output Sync

## Action

Follow the full-data-rebuild-and-site-output-sync workflow:
1. Restore or update data source files (such as CVE feeds or deprecations).
2. Regenerate all processed data files (e.g., incidents.json, incidents.min.json).
3. Regenerate all output artifacts (e.g., INCIDENTS.md, SVG charts, per-incident markdown files, year shards).
4. Commit all regenerated files to ensure outputs match the data source.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: data/incidents.json, data/incidents.min.json, docs/data/incidents.min.json

