# Genai_incidents Workflow Weekly Data Auto Refresh

## Action

Follow the weekly-data-auto-refresh workflow:
1. Update core incident data files (e.g., data/incidents.json, data/incidents.min.json, data/id_deprecations.json).
2. Regenerate summary documentation (INCIDENTS.md).
3. Update or add new incident markdown files in docs/incident/ (e.g., docs/incident/INC-XXXXX.md).
4. Regenerate data files in docs/data/ (e.g., docs/data/incidents.min.json).
5. Regenerate SVG chart visualizations in docs/charts/ (e.g., owasp_asi.svg, owasp_llm.svg, severity_stack.svg, year_bar.svg).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: INCIDENTS.md, data/id_deprecations.json, data/incidents.json

