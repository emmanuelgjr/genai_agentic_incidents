# Genai_incidents Workflow Bulk Incident Data Refresh

## Action

Follow the bulk-incident-data-refresh workflow:
1. Update core incident data files (e.g., incidents.json, id_deprecations.json).
2. Regenerate minified and derived data files (e.g., incidents.min.json, docs/data/incidents.min.json).
3. Update or add multiple incident markdown files under docs/incident/ (one per incident).
4. Update summary documentation (e.g., INCIDENTS.md).
5. Regenerate charts and visualizations under docs/charts/ to reflect new data.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: data/incidents.json, data/id_deprecations.json, data/incidents.min.json

