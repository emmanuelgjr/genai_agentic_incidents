title: "GenAI & Agentic AI Security Incidents"
description: >-
  Single source of truth for GenAI and agentic-AI security incidents,
  mapped to OWASP LLM Top 10, OWASP Agentic Top 10, NIST AI RMF, and
  MITRE ATLAS.
theme: minima
markdown: kramdown
# Keep filename → URL mapping simple so docs/index.html can deep-link
# into docs/incidents/<year>.html#inc-NNNNN from app.js.
permalink: /:path/:basename:output_ext
exclude:
  - _site
  - Gemfile
  - Gemfile.lock
