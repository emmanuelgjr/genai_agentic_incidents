name: Bug Report
description: Report a bug in the dataset, site, or package
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dataset (data quality, missing/incorrect fields)
        - Website (search, filters, charts, layout)
        - Python package (pip install genai-incidents)
        - Build/CI pipeline
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
