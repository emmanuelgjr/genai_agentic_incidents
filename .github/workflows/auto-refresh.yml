name: Weekly auto-refresh

on:
  schedule:
    # Sundays at 04:00 UTC. Adjust if you'd prefer a different cadence.
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      oecd_aim_limit:
        description: "Max OECD AIM pages to fetch (0 = all)"
        default: "3000"

permissions:
  contents: write
  pull-requests: write

# Never let a scheduled run and a manual dispatch (or two schedules) race on the
# shared auto-refresh/data branch. Queue them instead of cancelling so a run is
# never interrupted mid-commit.
concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh AIRI Navigator
        id: ingest_airi
        run: python scripts/ingest_airi_navigator.py
        continue-on-error: true

      - name: Refresh AIAAIC sheet
        id: ingest_aiaaic
        run: python scripts/ingest_aiaaic_sheet.py
        continue-on-error: true

      - name: Refresh OECD AI Incidents Monitor
        id: ingest_oecd
        env:
          OECD_AIM_LIMIT: ${{ github.event.inputs.oecd_aim_limit || '3000' }}
        run: python scripts/ingest_oecd_aim.py
        continue-on-error: true

      - name: Refresh CISA KEV catalog
        id: ingest_kev
        run: python scripts/ingest_cisa_kev.py
        continue-on-error: true

      # The ingest steps are continue-on-error so one flaky source doesn't
      # block the others — but if ALL of them failed, the "refreshed" data is
      # just last week's cache and the PR would ship silent staleness. Surface
      # per-source outcomes and abort in the nothing-refreshed case.
      - name: Ingest result summary
        env:
          AIRI: ${{ steps.ingest_airi.outcome }}
          AIAAIC: ${{ steps.ingest_aiaaic.outcome }}
          OECD: ${{ steps.ingest_oecd.outcome }}
        run: |
          {
            echo "### Source refresh results"
            echo "| Source | Outcome |"
            echo "|---|---|"
            echo "| AIRI Navigator | $AIRI |"
            echo "| AIAAIC sheet | $AIAAIC |"
            echo "| OECD AI Incidents Monitor | $OECD |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ok=0
          [ "$AIRI" = "success" ] && ok=$((ok+1))
          [ "$AIAAIC" = "success" ] && ok=$((ok+1))
          [ "$OECD" = "success" ] && ok=$((ok+1))
          if [ "$ok" -eq 0 ]; then
            echo "::error::All three source refreshes failed — the data would be stale. Aborting instead of opening a misleading refresh PR."
            exit 1
          fi
          if [ "$ok" -lt 3 ]; then
            echo "::warning::Only $ok of 3 sources refreshed — the PR will carry last week's data for the failed source(s)."
          fi

      # WS4-T9: the check above only catches "everything failed on the SAME
      # run". A single source that fails every week forever (AIRI Navigator,
      # dead since 2026-06-07) sails through it silently as long as at least
      # one other source succeeds, and the job keeps reporting overall
      # "success" — so nobody watching the repo is ever notified. This step
      # tracks CONSECUTIVE failures per source, persisted in
      # ingest/_state/source_health.json and committed via the refresh PR
      # below, same as every other ingest output.
      #
      # KNOWN LIMITATION (WS4-T9 bounce #1, advisory (b) — flagged, not
      # silently shipped): that PR is not always merged promptly (#2, #18,
      # #25 in this repo's history sat open and were closed unmerged,
      # superseded by the next week's run). If a brand-new source starts
      # failing and its PRs keep getting closed unmerged, its counter can
      # stall below threshold indefinitely — the loud-failure gate below
      # would never fire for it, only for sources (like AIRI here) whose
      # count already reached main before the stalling started. A fix would
      # need the counter to persist independently of the data-review PR (e.g.
      # a direct commit to `main` from this workflow, or a durable
      # out-of-band store) — that is a real change to this repo's git/CI
      # governance (unattended pushes to `main`) and is called out to the
      # human for a decision rather than made unilaterally here.
      - name: Source health check (consecutive-failure tracking)
        id: health
        continue-on-error: true
        env:
          AIRI: ${{ steps.ingest_airi.outcome }}
          AIAAIC: ${{ steps.ingest_aiaaic.outcome }}
          OECD: ${{ steps.ingest_oecd.outcome }}
          KEV: ${{ steps.ingest_kev.outcome }}
        run: |
          python scripts/check_source_health.py \
            --outcomes-json "{\"airi_navigator\": \"$AIRI\", \"aiaaic_sheet\": \"$AIAAIC\", \"oecd_aim\": \"$OECD\", \"cisa_kev\": \"$KEV\"}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Re-merge + render + validate
        run: |
          python scripts/parse_existing.py
          python scripts/merge_and_dedupe.py
          python scripts/render_markdown.py
          python scripts/validate.py

      # Hard gate: the same suite that runs on every PR/push. A regression in the
      # refreshed data or generated outputs blocks the PR instead of shipping it.
      - name: Unit tests
        run: pytest tests -q

      - name: Show summary
        run: |
          echo "::group::Diff stats"
          git diff --stat || true
          echo "::endgroup::"
          echo "::group::Counts"
          python -c "import json; d=json.load(open('data/incidents.json')); print('total:', d['incident_count']); print('generated:', d['generated'])"
          echo "::endgroup::"

      - name: Open / update refresh PR
        # Pinned to a full commit SHA (v7) for supply-chain safety; bump
        # deliberately rather than tracking a mutable tag.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(data): weekly auto-refresh"
          branch: auto-refresh/data
          base: main
          delete-branch: true
          title: "Weekly data refresh"
          labels: data-refresh, automated
          body: |
            Automated weekly refresh of external sources:
            AIRI Navigator, AIAAIC sheet, OECD AI Incidents Monitor.

            On each run this branch is recreated from the current `main`, so the
            diff is always relative to the latest `main` *at run time*. **Merge
            promptly** — if commits land on `main` after this PR opens, the open
            branch goes stale and merging it can revert that newer work. If it
            has sat open across other merges, close it and re-run this workflow
            (Actions → "Weekly auto-refresh" → Run workflow) rather than merging.

            Review the diff before merging — flag any unexpected mass deletions
            or large taxonomy shifts. Schema validation and the full unit-test
            suite both ran green in this workflow before the PR was opened.

      # Runs LAST (after the PR is already opened, carrying whatever sources
      # did refresh, plus the updated ingest/_state/source_health.json) so a
      # persistently-dead source never blocks the sources that ARE working —
      # but the workflow RUN itself still ends red and GitHub's own
      # failed-scheduled-workflow notification fires. This is the "can no
      # longer pass a refresh as a warning" gate from WS4-T9: a source stays
      # loud every single week until it recovers, or someone pauses it with a
      # reason AND an expiry (`paused_until`) in
      # ingest/_state/source_health.json — an expired or incomplete pause is
      # not honored (see scripts/check_source_health.py).
      - name: Enforce source health
        if: steps.health.outcome == 'failure'
        run: |
          echo "::error::A source has failed 3+ consecutive weekly refreshes (see 'Source health check' step above). Failing this run on purpose so it cannot be mistaken for success."
          exit 1
