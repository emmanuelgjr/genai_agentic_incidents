name: Validate dataset

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate incidents.json against schema
        run: python scripts/validate.py

      - name: Re-render INCIDENTS.md and ensure no drift
        run: |
          python scripts/render_markdown.py
          if [ -n "$(git status --porcelain INCIDENTS.md data/incidents.min.json)" ]; then
            echo "::error::INCIDENTS.md or incidents.min.json is out of date. Run scripts/render_markdown.py + scripts/merge_and_dedupe.py locally and commit the result."
            git diff INCIDENTS.md data/incidents.min.json | head -200
            exit 1
          fi
