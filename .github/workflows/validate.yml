name: Validate dataset

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest tests -q

      - name: Re-merge from ingest sources
        run: |
          python scripts/parse_existing.py
          python scripts/merge_and_dedupe.py

      - name: Validate incidents.json against schema
        run: python scripts/validate.py

      - name: Re-render INCIDENTS.md and ensure no drift
        run: |
          python scripts/render_markdown.py
          paths="INCIDENTS.md data/incidents.json data/incidents.min.json data/id_deprecations.json docs/incidents docs/data docs/charts src/genai_incidents/data src/genai_incidents/schema"
          if [ -n "$(git status --porcelain $paths)" ]; then
            echo "::error::Generated files are out of date. Run 'make build' locally and commit the result."
            git status --porcelain $paths
            echo "::group::Drifted file diff (first 200 lines)"
            for f in $(git status --porcelain $paths | awk '{print $2}'); do
              echo "--- diff for $f ---"
              git --no-pager diff -- "$f" | head -80
            done
            echo "::endgroup::"
            exit 1
          fi

      - name: Build pip package (smoke)
        run: |
          pip install --quiet --upgrade build
          python -m build --wheel
